[project]
name = "hivemind"
version = "0.1.0"
description = "Central expert agent management for AI coding platforms"
requires-python = ">=3.10"
dependencies = ["typer>=0.12.0", "rich>=13.7.0", "textual>=0.90.0", "crawl4ai>=0.4.0", "httpx>=0.27.0", "jinja2>=3.1.0"]

[project.scripts]
hivemind = "hivemind_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["hivemind_cli"]

[project.optional-dependencies]
dev = ["ruff>=0.11.0", "mypy>=1.15.0", "pre-commit>=4.0.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF",
    # Tier 1: low-effort, high-value rules
    "PIE", "PERF", "FURB", "RET", "PTH",
    "C4", "RSE", "ICN", "ERA", "LOG", "G",
    # Tier 2: medium-effort rules
    "TC", "TRY", "EM", "C90", "T20",
]
ignore = ["E501", "SIM108", "RUF012", "TRY003", "EM101", "EM102", "TRY300", "RET504"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"hivemind_cli/tui/**" = ["ARG"]
"hivemind_cli/core.py" = ["T201", "C901"]
"hivemind_cli/cli.py" = ["C901"]
"scripts/**" = ["T20", "C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
show_error_codes = true

# Strict by default — enforced on new/clean modules
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# Only crawl4ai lacks type stubs
[[tool.mypy.overrides]]
module = "crawl4ai.*"
ignore_missing_imports = true

# TUI: Textual mixin patterns produce false positives
[[tool.mypy.overrides]]
module = "hivemind_cli.tui.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["attr-defined", "arg-type", "no-any-return", "assignment"]

# core.py: large unannotated file — relax until incrementally annotated
[[tool.mypy.overrides]]
module = "hivemind_cli.core"
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
allow_untyped_globals = true

# cli.py: thin layer over core, mostly unannotated
[[tool.mypy.overrides]]
module = "hivemind_cli.cli"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# crawler.py: unannotated
[[tool.mypy.overrides]]
module = "hivemind_cli.crawler"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
