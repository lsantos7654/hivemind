[project]
name = "hivemind"
version = "0.1.0"
description = "Central expert agent management for AI coding platforms"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.90.0",
    "crawl4ai>=0.8.0",
    "trafilatura>=2.0.0",
    "lxml_html_clean>=0.4.1",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pydantic>=2.12.5",
    "mcp>=1.9.0",
]

[project.scripts]
hivemind = "hivemind.cli:main_entry"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind"]

[dependency-groups]
dev = ["ruff>=0.11.0", "mypy>=1.15.0", "pre-commit>=4.0.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF",
    # Tier 1: low-effort, high-value rules
    "PIE", "PERF", "FURB", "RET", "PTH",
    "C4", "RSE", "ICN", "ERA", "LOG", "G",
    # Tier 2: medium-effort rules
    "TC", "TRY", "EM", "C90", "T20",
    # Tier 3: stricter rules
    "N",    # pep8-naming
    "PT",   # pytest-style
    "PLW",  # pylint warnings
    "PLC",  # pylint conventions
    "FLY",  # flynt (f-string opportunities)
]
ignore = [
    # TRY: exception message strictness — too noisy for CLI
    "TRY003",  # long messages outside exception class
    "TRY300",  # move to else block — style opinion
    "TRY301",  # abstract raise to inner function
    # EM: string literals in exceptions — noisy for CLI one-off messages
    "EM101",   # string literal in exception (keep EM102 for f-strings)
    # RET: controversial superfluous-else rules
    "RET504",  # unnecessary assign before return — hurts debuggability
    "RET505",  # superfluous else after return
    "RET506",  # superfluous else after raise
    "RET507",  # superfluous else after continue
    "RET508",  # superfluous else after break
    # N: short/CamelCase variable names are idiomatic
    "N803",    # argument name should be lowercase
    "N806",    # variable in function should be lowercase
    # PT: opinion-only pytest rules
    "PT006",   # parametrize argument names style
    "PT007",   # parametrize values style
    "PT011",   # pytest.raises requires match=
    "PT013",   # import pytest as X
    # PL: complexity overlap with C90, intentional patterns
    "PLR0912", # too many branches (handled by C90)
    "PLR0913", # too many arguments (CLI commands legitimately have many)
    "PLR0915", # too many statements (handled by C90)
    "PLR2004", # magic value comparison — too noisy in CLI/TUI
    "PLC0415", # import not at top level (intentional lazy imports)
    "PLW0603", # global statement — intentional for module-level caches
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"src/hivemind/experts.py" = ["C901"]
"src/hivemind/cli.py" = ["C901", "TRY003", "EM101", "PLR0912"]
"src/hivemind/providers/*.py" = ["ARG002"]
"src/hivemind/mcp/*.py" = ["TRY003", "EM101"]
"src/hivemind/tui/**/*.py" = ["TRY003", "EM101"]
"tests/**/*.py" = ["S101", "PLR2004", "PT011", "SIM117"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
show_error_codes = true

# Strict by default — enforced on new/clean modules
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
# Additional strict flags
disallow_any_generics = true
disallow_subclassing_any = true
no_implicit_reexport = true
warn_no_return = true
warn_unreachable = true

# Third-party packages lacking type stubs
[[tool.mypy.overrides]]
module = ["crawl4ai.*", "trafilatura.*", "mcp.*"]
ignore_missing_imports = true

# crawl: crawl4ai + trafilatura lack type stubs, heavy use of Any
[[tool.mypy.overrides]]
module = "hivemind.crawl.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# TUI: Textual mixin patterns produce false positives
[[tool.mypy.overrides]]
module = "hivemind.tui.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["attr-defined", "arg-type", "no-any-return", "assignment", "type-arg", "unreachable"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
