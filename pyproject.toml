[project]
name = "hivemind"
version = "0.1.0"
description = "Central expert agent management for AI coding platforms"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.90.0",
    "firecrawl-py>=2.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pydantic>=2.12.5",
]

[project.scripts]
hivemind = "hivemind.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind"]

[dependency-groups]
dev = ["ruff>=0.11.0", "mypy>=1.15.0", "pre-commit>=4.0.0", "pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF",
    # Tier 1: low-effort, high-value rules
    "PIE", "PERF", "FURB", "RET", "PTH",
    "C4", "RSE", "ICN", "ERA", "LOG", "G",
    # Tier 2: medium-effort rules
    "TC", "TRY", "EM", "C90", "T20",
]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"src/hivemind/experts.py" = ["C901"]
"src/hivemind/cli.py" = ["C901"]
"src/hivemind/providers/*.py" = ["ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
show_error_codes = true

# Strict by default — enforced on new/clean modules
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

# Third-party packages lacking type stubs
[[tool.mypy.overrides]]
module = ["firecrawl.*", "typer.*"]
ignore_missing_imports = true

# TUI: Textual mixin patterns produce false positives
[[tool.mypy.overrides]]
module = "hivemind.tui.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["attr-defined", "arg-type", "no-any-return", "assignment"]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
