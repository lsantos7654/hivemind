name: hivemind-firecrawl

services:
  playwright-service:
    image: ghcr.io/firecrawl/playwright-service:latest
    environment:
      PORT: "3000"
      PROXY_SERVER: "${PROXY_SERVER:-}"
      PROXY_USERNAME: "${PROXY_USERNAME:-}"
      PROXY_PASSWORD: "${PROXY_PASSWORD:-}"
      BLOCK_MEDIA: "${BLOCK_MEDIA:-}"
      MAX_CONCURRENT_PAGES: "${CRAWL_CONCURRENT_REQUESTS:-10}"
    networks:
      - backend
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  api:
    image: ghcr.io/firecrawl/firecrawl:latest
    environment:
      HOST: "0.0.0.0"
      PORT: "3002"
      ENV: local
      REDIS_URL: redis://redis:6379
      REDIS_RATE_LIMIT_URL: redis://redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
      USE_DB_AUTHENTICATION: "false"
      BULL_AUTH_KEY: "${BULL_AUTH_KEY:-hivemind-admin}"
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: "5432"
      NUM_WORKERS_PER_QUEUE: "${NUM_WORKERS_PER_QUEUE:-8}"
      CRAWL_CONCURRENT_REQUESTS: "${CRAWL_CONCURRENT_REQUESTS:-10}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-5}"
      BROWSER_POOL_SIZE: "${BROWSER_POOL_SIZE:-5}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      PROXY_SERVER: "${PROXY_SERVER:-}"
      PROXY_USERNAME: "${PROXY_USERNAME:-}"
      PROXY_PASSWORD: "${PROXY_PASSWORD:-}"
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "3002:3002"
    command: node dist/src/harness.js --start-docker
    networks:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  redis:
    image: redis:alpine
    command: redis-server --bind 0.0.0.0
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - backend

  nuq-postgres:
    build: ./init-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      - backend

networks:
  backend:
    driver: bridge
