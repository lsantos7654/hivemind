repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Safety checks first
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: fix-byte-order-marker
      - id: check-docstring-first
      # Formatters — patches in third_party/{patches,dep_patches}/
      # are git format-patch output; mangling whitespace breaks
      # `git am` reproducibility, so exclude them from auto-fixers.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '^(experts/|third_party/(patches|dep_patches)/)'
      - id: end-of-file-fixer
        exclude: '^(experts/|third_party/(patches|dep_patches)/)'
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '^third_party/(patches|dep_patches)/'
      # Validators
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
      - id: validate-pyproject

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src/hivemind/
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
